services:
  mixtape:
    image: ghcr.io/mark-me/mixtape-society:latest
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile
    container_name: mixtape-society
    restart: unless-stopped
    # Only the data directory and /tmp can be written to.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "5000:5000"
    volumes:
      # Your music collection (read-only)
      - /home/mark/Music:/music:ro
      # App-generated data
      - ../collection-data:/app/collection-data
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO

      # These override everything — required in production
      - MUSIC_ROOT=/music
      - DATA_ROOT=/app/collection-data

      # Strong password! Set it in docker/.env, which stays out of git
      - PASSWORD=${PASSWORD:?Set PASSWORD in docker/.env}