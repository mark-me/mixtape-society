name: Build & Push Docker Image

on:
  push:
    branches: [ master, test ]
    tags: [ 'v*.*.*' ]

jobs:
  # The packages are checked for known vulnerabilities; a dangerous one stops the image.
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      # For the weekly scan of the published image, which this call does not run.
      packages: read

  build-and-push:
    needs: [security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the branch name (:master or :test), the release version for a
      # v*.*.* tag, the short commit SHA, and :latest for master.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=Mixtape Society
            org.opencontainers.image.description=Music collection manager with multi-architecture support (amd64, arm64)
            org.opencontainers.image.vendor=mark-me
          annotations: |
            org.opencontainers.image.title=Mixtape Society
            org.opencontainers.image.description=Music collection manager with multi-architecture support (amd64, arm64)
            org.opencontainers.image.vendor=mark-me

      - name: Compute version for APP_VERSION
        id: version
        run: |
          # If it's a proper tag like v1.2.3
          if [[ ${{ github.ref }} == refs/tags/v*.*.* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "display_version=${VERSION}" >> $GITHUB_OUTPUT

          # If on master branch
          elif [[ ${{ github.ref }} == refs/heads/master ]]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            BASE_VERSION=${LATEST_TAG#v}
            COMMIT_DISTANCE=$(git rev-list --count ${LATEST_TAG}..HEAD 2>/dev/null || echo "0")
            if [ "$COMMIT_DISTANCE" -eq 0 ]; then
              echo "version=${BASE_VERSION}" >> $GITHUB_OUTPUT
              echo "display_version=${BASE_VERSION}" >> $GITHUB_OUTPUT
            else
              SHORT_SHA=$(git rev-parse --short=8 HEAD)
              echo "version=${BASE_VERSION}+dev.${COMMIT_DISTANCE}.${SHORT_SHA}" >> $GITHUB_OUTPUT
              echo "display_version=${BASE_VERSION}+master.${COMMIT_DISTANCE}.${SHORT_SHA}" >> $GITHUB_OUTPUT
            fi

          # If on test branch
          elif [[ ${{ github.ref }} == refs/heads/test ]]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            BASE_VERSION=${LATEST_TAG#v}
            SHORT_SHA=$(git rev-parse --short=8 HEAD)
            echo "version=${BASE_VERSION}+test.${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "display_version=${BASE_VERSION}+test.${SHORT_SHA}" >> $GITHUB_OUTPUT

          # Fallback: PRs, feature branches, etc.
          else
            SHORT_SHA=$(git rev-parse --short=8 HEAD)
            BRANCH=$(echo ${{ github.head_ref || github.ref_name }} | tr '/' '-')
            echo "version=dev.${BRANCH}.${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "display_version=dev.${BRANCH}.${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Determine build platforms
        id: platforms
        run: |
          # Test branch: amd64 only for faster builds
          # Master and tags: multi-architecture build (amd64, arm64)
          if [[ ${{ github.ref }} == refs/heads/test ]]; then
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
          else
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          fi

      # The image is built once for amd64 and scanned before anything is published: the
      # Debian packages of the base image, and Python's own, which the package scan does not
      # see. The build is kept in the cache, so the push below reuses it.
      - name: Build the image to scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: mixtape-society:scan
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        uses: ./.github/actions/install-trivy
        with:
          version: "0.76.0" # As in security.yml.

      # In an empty folder, so no .trivyignore or trivy.yaml from the checkout is read. A
      # vulnerability without a fix is listed but cannot be resolved by building again.
      - name: Scan the image
        working-directory: ${{ runner.temp }}
        run: |
          mkdir scan-image && cd scan-image
          trivy image --scanners vuln --format table --exit-code 0 mixtape-society:scan
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format table \
            --exit-code 1 mixtape-society:scan

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ steps.platforms.outputs.platforms }}
          cache-from: type=gha
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
