  ] },
  { "Project" = [
    { "Overview" = "project/index.md" },
    { "Changelog" = "project/changelog.md" },
    { "Roadmap" = "project/roadmap.md" },
    { "Ideas" = [
      { "General Ideas" = "project/ideas/ideas.md" },
      { "Design & Implementation Map" = "project/ideas/design_implementation_map.md" },
    ] },
    { "Contributing" = "project/contributing.md" },
    { "About" = "project/about.md" },
  ] },
]

[project.theme]
logo = "images/logo.png"
favicon = "images/logo.png"
language = "en"
# The fonts come with the site, from stylesheets/extra.css, instead of from Google.
font = false
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.prune",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/mark-me/mixtape-society"
name = "GitHub Repository"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.permalink_title = "Anchor link to this section"
toc.toc_depth = 2
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.arithmatex.generic = true
pymdownx.betterem.smart_enable = "all"
pymdownx.caret = {}
pymdownx.critic.mode = "accept"
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# The API pages are read from the docstrings: parsed, so the app is not installed for it.
[project.plugins.mkdocstrings.handlers.python]
paths = ["."]
inventories = []

[project.plugins.mkdocstrings.handlers.python.options]
show_bases = true
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
show_source = true
members_order = "source"
heading_level = 2
summary = true
docstring_style = "google"
docstring_section_style = "table"
show_if_no_docstring = false
inherited_members = false
merge_init_into_class = true
